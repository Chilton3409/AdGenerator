{% extends 'ad_creation/home.html' %}
{% block content %}
  <div class="container mt-5 mb-5">
    <h1 class="mb-4 text-center">Delete Advertisement</h1>
    <div class="card">
      <div class="card-body">
        <p class="card-text">Are you sure you want to delete the advertisement "{{ advertisement.prompt }}"?</p>
        <p class="card-text">Content: "{{ advertisement.content }}"?</p>
        <form method="post">
          {% csrf_token %}
          <div class="d-grid gap-2 d-md-flex justify-content-md-end">
            <a href="{% url 'ad_detail' advertisement.pk %}" class="btn btn-secondary me-2">Cancel</a>
            <button type="submit" class="btn btn-danger">Delete</button>
          </div>
        </form>
      </div>
    </div>
    <p class="mt-4 text-center"><a href="{% url 'dashboard' %}">Back to Dashboard</a></p>
  </div>
{% endblock %}
